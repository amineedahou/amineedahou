name: Update latest projects

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/update-projects.mjs"
      - ".github/workflows/update-projects.yml"

permissions:
  contents: write

concurrency:
  group: update-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update projects section in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          PROJECT_COUNT: 6        # how many projects to show
          PROJECT_EXCLUDE: ""     # comma-separated repo names to hide, e.g. "test,old-site"
        run: node .github/scripts/update-projects.mjs

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update latest projects"
            git pull --rebase
            git push
          else
            echo "No changes."
          fi
